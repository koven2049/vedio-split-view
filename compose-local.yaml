services:
  backend:
    build:
      context: ./backend
      args:
        REGISTRY: ${REGISTRY:-docker.io}
    container_name: vsplit-backend
    ports:
      - "4305:4305"
    volumes:
      - ./config:/app/config:ro
      - ./data:/app/data
      - ./logs:/app/logs
    environment:
      - PORT=${APP_PORT:-8080}
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:${APP_PORT:-8080}/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3

  frontend:
    build:
      context: ./frontend
      args:
        REGISTRY: ${REGISTRY:-docker.io}
    container_name: vsplit-frontend
    ports:
      - "${FRONTEND_PORT:-5180}:80"
    volumes:
      - ./logs/nginx:/var/log/nginx
    depends_on:
      - backend
    restart: unless-stopped
