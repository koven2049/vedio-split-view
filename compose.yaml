services:
  backend:
    build:
      context: ./backend
      args:
        REGISTRY: ${REGISTRY:-docker.io}
    container_name: vsplit-backend
    ports:
      - "${APP_PORT:-8080}:8080"
    volumes:
      - ./config:/app/config:ro
      - ./data:/app/data
      - ./logs:/app/logs
    environment:
      - http_proxy=
      - https_proxy=
      - HTTP_PROXY=
      - HTTPS_PROXY=
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3

  frontend:
    build:
      context: ./frontend
      args:
        REGISTRY: ${REGISTRY:-docker.io}
    container_name: vsplit-frontend
    ports:
      - "${FRONTEND_PORT:-5180}:443"
    volumes:
      - ./config/certs:/etc/nginx/certs:ro
    depends_on:
      - backend
    restart: unless-stopped
