[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "video-split"
version = "0.1.0"
description = "Video analysis and segmentation service"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "pydantic>=2.0.0",
    "pydantic-settings>=2.0.0",
    "sqlalchemy>=2.0.0",
    "aiosqlite>=0.20.0",
    "yt-dlp>=2024.0.0",
    "yt-dlp-ejs>=0.5.0",
    "youtube-transcript-api>=0.6.0",
    "httpx>=0.27.0",
    "PyJWT>=2.8.0",
    "bcrypt>=4.1.0",
    "typer[all]>=0.12.0",
    "rich>=13.0.0",
    "sse-starlette>=2.0.0",
    "pyyaml>=6.0.0",
    "qrcode[pil]>=7.4.0",
    "python-multipart>=0.0.9",
    "oss2>=2.18.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "httpx>=0.27.0",
    "ruff>=0.4.0",
]

[project.scripts]
vsplit = "video_split.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/video_split"]

[tool.ruff]
line-length = 100

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
