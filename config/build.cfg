# 构建源配置 — 用于 manage.sh rebuild
# 从 build.cfg.example 复制而来。不含密钥，随代码同步到远端。

# 容器镜像仓库（国内直连 docker.io 常超时，走 daocloud 镜像）
registry = docker.m.daocloud.io

# podman 构建 DNS（拉镜像 / apt）。不要用于运行容器：自定义网络上 --dns
# 会变成 aardvark 的唯一上游，公网解析单点失败即 EAI_AGAIN。
podman_dns = 223.5.5.5

# Debian apt 镜像域名
apt_mirror = mirrors.aliyun.com

# PyPI 索引
pypi_index = https://mirrors.aliyun.com/pypi/simple/
pypi_trusted_host = mirrors.aliyun.com
